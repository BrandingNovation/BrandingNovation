version: '3.8'

services:
  # Frontend - Next.js Production Build
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.production
      target: production
    container_name: flowforge-frontend
    ports:
      - "80:3000"
      - "443:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.flowforge.com
      - NEXT_PUBLIC_WS_URL=wss://ws.flowforge.com
      - NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${STRIPE_PUBLIC_KEY}
      - NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${GA_TRACKING_ID}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - flowforge-network
    volumes:
      - ./ssl:/etc/ssl/certs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`flowforge.com`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"

  # Backend API - Fastify Production
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.production
    container_name: flowforge-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MONGODB_URL=mongodb://mongo:27017/flowforge
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - SENTRY_DSN=${SENTRY_DSN}
    restart: unless-stopped
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - flowforge-network
    volumes:
      - ./logs:/app/logs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.flowforge.com`)"
      - "traefik.http.routers.api.tls=true"

  # WebSocket Server for Real-time Collaboration
  websocket:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.websocket
    container_name: flowforge-websocket
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - flowforge-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.websocket.rule=Host(`ws.flowforge.com`)"
      - "traefik.http.routers.websocket.tls=true"

  # PostgreSQL Database with Backup
  postgres:
    image: postgres:15-alpine
    container_name: flowforge-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./apps/api/src/database/schema.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped
    networks:
      - flowforge-network
    ports:
      - "5432:5432"

  # MongoDB for Document Storage
  mongo:
    image: mongo:6.0
    container_name: flowforge-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=flowforge
    volumes:
      - mongo_data:/data/db
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - flowforge-network
    ports:
      - "27017:27017"

  # Redis for Caching and Sessions
  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - flowforge-network
    ports:
      - "6379:6379"

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: flowforge-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/ssl/certs
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - api
      - websocket
    networks:
      - flowforge-network

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: flowforge-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - flowforge-network

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: flowforge-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - flowforge-network

  # Log Aggregation - ELK Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: flowforge-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - flowforge-network

  # Backup Service
  backup:
    image: alpine:latest
    container_name: flowforge-backup
    volumes:
      - postgres_data:/data/postgres
      - mongo_data:/data/mongo
      - redis_data:/data/redis
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    command: sh -c "chmod +x /backup.sh && crond -f"
    restart: unless-stopped
    networks:
      - flowforge-network

volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  flowforge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16